services:
  - type: web
    name: arcana-school
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.11.0
      - key: DATA_DIR
        value: /var/data/arcana
    disk:
      name: arcana-data
      mountPath: /var/data
      sizeGB: 1
